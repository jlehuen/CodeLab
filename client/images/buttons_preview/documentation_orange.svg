<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Soft shadow filter identical in offset and blur to download.png -->
    <filter id="shadow_orange" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="8" dy="11" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad_orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Glossy top reflection highlight -->
    <linearGradient id="gloss_orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18" />
    </linearGradient>

    <!-- Page gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- 1. The Pill Shaped Button (height 184, rx=92, width enlarged to fit 96px font) -->
  <g filter="url(#shadow_orange)">
    <rect x="145" y="88" width="980" height="184" rx="92" ry="92"
          fill="url(#pillGrad_orange)"
          stroke="#7c2d12" stroke-width="8.5" />
    <!-- Glossy finish -->
    <rect x="149" y="92" width="972" height="176" rx="88" ry="88"
          fill="url(#gloss_orange)" />
  </g>

  <!-- 2. Big Stylized Open Book Icon on Left (bursts above and below pill, matching Download arrow) -->
  <g filter="url(#shadow_orange)">
    <!-- Bottom book cover / thickness -->
    <path d="M 100 286
             C 140 273, 175 275, 215 291
             C 255 277, 290 275, 330 286
             L 330 298
             C 290 285, 255 287, 215 303
             C 175 287, 140 285, 100 298
             Z"
          fill="#7c2d12" stroke="#7c2d12" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Left Book Page -->
    <path d="M 215 62
             C 175 46, 140 49, 100 62
             C 96 63, 95 68, 95 73
             L 95 282
             C 95 287, 98 290, 102 289
             C 140 274, 175 272, 215 289
             Z"
          fill="url(#pageGrad)" stroke="#7c2d12" stroke-width="8.5" stroke-linejoin="round" />

    <!-- Right Book Page -->
    <path d="M 215 62
             C 255 38, 290 49, 330 62
             C 334 63, 335 68, 335 73
             L 335 282
             C 335 287, 332 290, 328 289
             C 290 274, 255 272, 215 289
             Z"
          fill="url(#pageGrad)" stroke="#7c2d12" stroke-width="8.5" stroke-linejoin="round" />

    <!-- Book Center Fold / Spine Crease -->
    <line x1="215" y1="62" x2="215" y2="289"
          stroke="#7c2d12" stroke-width="7" stroke-linecap="round" />

    <!-- Hanging Bookmark Ribbon -->
    <path d="M 210 62
             L 210 128
             L 215 119
             L 220 128
             L 220 62
             Z"
          fill="#38bdf8" stroke="#7c2d12" stroke-width="3" stroke-linejoin="round" />

    <!-- Text lines on left page -->
    <line x1="127" y1="110" x2="185" y2="105" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <line x1="127" y1="143" x2="185" y2="138" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <line x1="127" y1="176" x2="185" y2="171" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <line x1="127" y1="209" x2="185" y2="204" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <line x1="127" y1="242" x2="173" y2="237" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.65" />

    <!-- Text lines on right page -->
    <line x1="245" y1="105" x2="303" y2="110" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <line x1="245" y1="138" x2="303" y2="143" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <line x1="245" y1="171" x2="303" y2="176" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <line x1="245" y1="204" x2="303" y2="209" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <line x1="245" y1="237" x2="293" y2="242" stroke="#7c2d12" stroke-width="5" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- 3. Typography "Documentation" at font-size 96 -->
  <g>
    <text x="731.5" y="213.5"
          font-family="Arial, Helvetica, sans-serif"
          font-size="96"
          font-weight="bold"
          fill="#000000"
          fill-opacity="0.25"
          text-anchor="middle"
          letter-spacing="-0.5">Documentation</text>
    <text x="730" y="212"
          font-family="Arial, Helvetica, sans-serif"
          font-size="96"
          font-weight="bold"
          fill="#FFFFFF"
          text-anchor="middle"
          letter-spacing="-0.5">Documentation</text>
  </g>
</svg>