<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 959 360" width="959" height="360">
  <defs>
    <!-- Soft shadow filter identical in offset and blur to download.png -->
    <filter id="shadow_indigo" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="8" dy="11" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad_indigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Glossy top reflection highlight -->
    <linearGradient id="gloss_indigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18" />
    </linearGradient>

    <!-- Page gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- 1. The Pill Shaped Button (matches x=145..885, y=90..270) -->
  <g filter="url(#shadow_indigo)">
    <rect x="145" y="90" width="740" height="180" rx="90" ry="90"
          fill="url(#pillGrad_indigo)"
          stroke="#4c1d95" stroke-width="8" />
    <!-- Glossy finish -->
    <rect x="149" y="94" width="732" height="172" rx="86" ry="86"
          fill="url(#gloss_indigo)" />
  </g>

  <!-- 2. Stylized Open Book Icon on Left (Compact to match Download arrow width) -->
  <g filter="url(#shadow_indigo)">
    <!-- Bottom book cover / thickness -->
    <path d="M 115 248
             C 150 237, 180 239, 215 253
             C 250 239, 280 237, 315 248
             L 315 258
             C 280 247, 250 249, 215 263
             C 180 249, 150 247, 115 258
             Z"
          fill="#4c1d95" stroke="#4c1d95" stroke-width="4" stroke-linejoin="round" />

    <!-- Left Book Page -->
    <path d="M 215 110
             C 180 96, 150 98, 115 110
             C 111 111, 110 115, 110 119
             L 110 245
             C 110 249, 113 252, 116 251
             C 150 238, 180 236, 215 251
             Z"
          fill="url(#pageGrad)" stroke="#4c1d95" stroke-width="8" stroke-linejoin="round" />

    <!-- Right Book Page -->
    <path d="M 215 110
             C 250 96, 280 98, 315 110
             C 319 111, 320 115, 320 119
             L 320 245
             C 320 249, 317 252, 314 251
             C 280 238, 250 236, 215 251
             Z"
          fill="url(#pageGrad)" stroke="#4c1d95" stroke-width="8" stroke-linejoin="round" />

    <!-- Book Center Fold / Spine Crease -->
    <line x1="215" y1="110" x2="215" y2="251"
          stroke="#4c1d95" stroke-width="6" stroke-linecap="round" />

    <!-- Hanging Bookmark Ribbon -->
    <path d="M 211 110
             L 211 153
             L 215 147
             L 219 153
             L 219 110
             Z"
          fill="#fbbf24" stroke="#4c1d95" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Text lines on left page -->
    <line x1="138" y1="145" x2="190" y2="141" stroke="#4c1d95" stroke-width="4.5" stroke-linecap="round" opacity="0.65" />
    <line x1="138" y1="171" x2="190" y2="167" stroke="#4c1d95" stroke-width="4.5" stroke-linecap="round" opacity="0.65" />
    <line x1="138" y1="197" x2="180" y2="193" stroke="#4c1d95" stroke-width="4.5" stroke-linecap="round" opacity="0.65" />

    <!-- Text lines on right page -->
    <line x1="240" y1="141" x2="292" y2="145" stroke="#4c1d95" stroke-width="4.5" stroke-linecap="round" opacity="0.65" />
    <line x1="240" y1="167" x2="292" y2="171" stroke="#4c1d95" stroke-width="4.5" stroke-linecap="round" opacity="0.65" />
    <line x1="240" y1="193" x2="282" y2="197" stroke="#4c1d95" stroke-width="4.5" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- 3. Typography "Documentation" perfectly centered and balanced -->
  <g>
    <text x="601.5" y="204.5"
          font-family="Arial, Helvetica, sans-serif"
          font-size="62"
          font-weight="bold"
          fill="#000000"
          fill-opacity="0.25"
          text-anchor="middle"
          letter-spacing="-0.5">Documentation</text>
    <text x="600" y="203"
          font-family="Arial, Helvetica, sans-serif"
          font-size="62"
          font-weight="bold"
          fill="#FFFFFF"
          text-anchor="middle"
          letter-spacing="-0.5">Documentation</text>
  </g>
</svg>