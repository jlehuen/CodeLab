<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 959 360" width="959" height="360">
  <defs>
    <!-- Soft shadow filter identical in offset and blur to download.png -->
    <filter id="shadow_blue" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="8" dy="11" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad_blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Glossy top reflection highlight -->
    <linearGradient id="gloss_blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18" />
    </linearGradient>

    <!-- Page gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- 1. The Pill Shaped Button (matches x=145..885, y=90..270) -->
  <g filter="url(#shadow_blue)">
    <rect x="145" y="90" width="740" height="180" rx="90" ry="90"
          fill="url(#pillGrad_blue)"
          stroke="#0c4a6e" stroke-width="8" />
    <!-- Glossy finish -->
    <rect x="149" y="94" width="732" height="172" rx="86" ry="86"
          fill="url(#gloss_blue)" />
  </g>

  <!-- 2. The Big Stylized Documentation Icon on Left (Overlapping pill like Download arrow) -->
  <g filter="url(#shadow_blue)">
    <!-- Bottom book cover / thickness -->
    <path d="M 100 248
             C 140 236, 185 238, 225 254
             C 265 238, 310 236, 350 248
             L 350 258
             C 310 246, 265 248, 225 264
             C 185 248, 140 246, 100 258
             Z"
          fill="#0c4a6e" stroke="#0c4a6e" stroke-width="4" stroke-linejoin="round" />

    <!-- Left Book Page -->
    <path d="M 225 108
             C 185 92, 138 94, 100 108
             C 96 109, 94 113, 94 117
             L 94 245
             C 94 249, 97 253, 101 251
             C 139 237, 185 235, 225 252
             Z"
          fill="url(#pageGrad)" stroke="#0c4a6e" stroke-width="8.5" stroke-linejoin="round" />

    <!-- Right Book Page -->
    <path d="M 225 108
             C 265 92, 312 94, 350 108
             C 354 109, 356 113, 356 117
             L 356 245
             C 356 249, 353 253, 349 251
             C 311 237, 265 235, 225 252
             Z"
          fill="url(#pageGrad)" stroke="#0c4a6e" stroke-width="8.5" stroke-linejoin="round" />

    <!-- Book Center Fold / Spine Crease -->
    <line x1="225" y1="108" x2="225" y2="252"
          stroke="#0c4a6e" stroke-width="6.5" stroke-linecap="round" />

    <!-- Hanging Bookmark Ribbon -->
    <path d="M 220 108
             L 220 155
             L 225 148
             L 230 155
             L 230 108
             Z"
          fill="#e0f2fe" stroke="#0c4a6e" stroke-width="3" stroke-linejoin="round" />

    <!-- Text lines on left page -->
    <line x1="126" y1="145" x2="195" y2="140" stroke="#0c4a6e" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <line x1="126" y1="172" x2="195" y2="167" stroke="#0c4a6e" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <line x1="126" y1="199" x2="185" y2="194" stroke="#0c4a6e" stroke-width="5" stroke-linecap="round" opacity="0.65" />

    <!-- Text lines on right page -->
    <line x1="255" y1="140" x2="324" y2="145" stroke="#0c4a6e" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <line x1="255" y1="167" x2="324" y2="172" stroke="#0c4a6e" stroke-width="5" stroke-linecap="round" opacity="0.65" />
    <line x1="255" y1="194" x2="314" y2="199" stroke="#0c4a6e" stroke-width="5" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- 3. Typography "Documentation" -->
  <g>
    <!-- Subtle drop shadow on text for depth like Download -->
    <text x="618" y="210"
          font-family="Arial, Helvetica, sans-serif"
          font-size="82"
          font-weight="bold"
          fill="#000000"
          fill-opacity="0.25"
          text-anchor="middle"
          letter-spacing="-0.5">Documentation</text>
    <text x="616" y="208"
          font-family="Arial, Helvetica, sans-serif"
          font-size="82"
          font-weight="bold"
          fill="#FFFFFF"
          text-anchor="middle"
          letter-spacing="-0.5">Documentation</text>
  </g>
</svg>