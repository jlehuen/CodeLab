#####################################################################
## Regular tasks in connected mode (backup in minutes)

BACKUP_PERIOD=5
UPDATE_PERIOD=3000
UPDATE_PERIOD_FAST=1000

#####################################################################
## Paths to embedded binaries

CLIPS_CMD=bin/clips631
MAGIC_CMD=bin/astyle

#####################################################################
## Section astyle (see http://astyle.sourceforge.net/astyle.html)

MAGIC_OPTIONS=--style=java \
	--indent=force-tab --indent-switches --indent-after-parens \
	--pad-comma --pad-oper --pad-header --unpad-paren \
	--align-pointer=type --align-reference=name --break-closing-braces \
	--attach-return-type --errors-to-stdout --ascii --quiet

#####################################################################
## CodeLab website and Property file over Internet

URL_INFO=https://codelab.univ-lemans.fr
URL_PROP=https://codelab.univ-lemans.fr/data/web.properties

#####################################################################
## Other data

BLOCS_OFFSET=10
