name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'mkdocs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install mkdocs

      - name: Build Documentation (FR & EN)
        run: |
          mkdir -p _site
          cd mkdocs/doc-fr && mkdocs build -d ../../_site/doc-fr && cd ../..
          cd mkdocs/doc-en && mkdocs build -d ../../_site/doc-en && cd ../..
          cp mkdocs/index.html _site/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
