name: Publish CodeLab JAR to Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag cible (ex: v1.5.4)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-jar-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-publish-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Apache Ant is installed
        run: |
          if ! command -v ant >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ant
          fi

      - name: Build codelab.jar and SHA-256 checksum
        working-directory: client
        run: |
          ant -f build.xml codelab
          ls -lh hidden/codelab/codelab.jar hidden/codelab/codelab.jar.sha256
          cat hidden/codelab/codelab.jar.sha256

      - name: Create or update GitHub Release with codelab.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          upload_with_retry() {
            local attempt=1
            local max_attempts=3
            while [ "$attempt" -le "$max_attempts" ]; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Échec upload GitHub (tentative $attempt/$max_attempts), nouvelle tentative dans 5s..." >&2
                sleep 5
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existe déjà — mise à jour séquentielle des assets JAR..."
            upload_with_retry gh release upload "$TAG" \
              client/hidden/codelab/codelab.jar \
              --clobber
            upload_with_retry gh release upload "$TAG" \
              client/hidden/codelab/codelab.jar.sha256 \
              --clobber
          else
            echo "Création de la release $TAG avec codelab.jar et codelab.jar.sha256..."
            upload_with_retry gh release create "$TAG" \
              client/hidden/codelab/codelab.jar \
              client/hidden/codelab/codelab.jar.sha256 \
              --title "CodeLab $TAG" \
              --generate-notes
          fi
